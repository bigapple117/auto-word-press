# HTTP: 모두 https://jalcheck.com 으로 보냄
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://jalcheck.com$request_uri;
}

# HTTPS: Cloudflare Origin CA 인증서 (Cloudflare SSL 모드 Full strict 전제)
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name jalcheck.com www.jalcheck.com;

    ssl_certificate     /etc/ssl/certs/jalcheck.com.pem;
    ssl_certificate_key /etc/ssl/private/jalcheck.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host = www.jalcheck.com) {
        return 301 https://jalcheck.com$request_uri;
    }

    root /var/www/html;
    index index.php index.html index.nginx-debian.html;
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    # 로그인 화면은 시도 횟수를 제한한다(비밀번호 무작위 대입 방지)
    location = /wp-login.php {
        limit_req zone=wplogin burst=10 nodelay;
        limit_req_status 429;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    # 쓰지 않는 예전 원격 접속 통로. 비밀번호 대입에 악용되므로 닫는다
    location = /xmlrpc.php { deny all; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ /\.ht { deny all; }
}
